<!doctype html>

<style>
  body { width: 1400px; height: 700px; background: radial-gradient(circle at 78% 40%, #1d4fb8 0%, #0d2a66 45%, #081a40 100%); }
  .wrap { position: relative; height: 100%; padding: 72px 76px; display: flex; }

  .chip { background: #fff; color: var(--navy); font-weight: 700; font-size: 15px; padding: 9px 12px; white-space: nowrap; flex-shrink: 0; border-radius: 12px; display: flex; gap: 8px; align-items: center; }
  .chip b { background: var(--blue); color: #fff; border-radius: 7px; padding: 1px 8px; font-size: 14px; }
  .art { position: absolute; right: 40px; top: 70px; width: 620px; }
  .dots { position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,.07) 1.5px, transparent 1.5px); background-size: 28px 28px; }
